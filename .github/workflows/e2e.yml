name: end-to-end

# Manual only: it downloads about 4 GB of weights. Needs a public repository, because the weights
# are fetched from the releases without a login, the way a new user would.
on:
  workflow_dispatch:

jobs:
  serve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Folder for weights and outputs
        run: echo "KELTER_HOME=$RUNNER_TEMP/kelter-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir "$RUNNER_TEMP/dist" .
      - name: Install torch, then the wheel, into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$PY" -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          else
            "$PY" -m pip install torch==2.11.0
          fi
          "$PY" -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: What the machine offers
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import platform, torch; from kelter.device import default_device; print('machine', platform.machine(), platform.platform()); print('mps available', getattr(torch.backends, 'mps', None) is not None and torch.backends.mps.is_available()); print('cuda available', torch.cuda.is_available()); print('kelter picks', default_device())"
          "$RUNNER_TEMP/venv/bin/kelter"
      - name: Download the smaller model without a login
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/kelter" download --variant lower-latency
          "$RUNNER_TEMP/venv/bin/kelter"
      - name: Serve it and ask the two example questions
        working-directory: ${{ runner.temp }}
        run: |
          K="$RUNNER_TEMP/venv/bin/kelter"
          ask() {  # $1: device to force, or "auto"
            if [ "$1" = "auto" ]; then unset KELTER_DEVICE; else export KELTER_DEVICE="$1"; fi
            "$K" serve --variant lower-latency --port 8765 > "server_$1.log" 2>&1 &
            SERVER=$!
            for i in $(seq 1 150); do
              if curl -s -o /dev/null http://127.0.0.1:8765/; then break; fi
              if ! kill -0 "$SERVER" 2>/dev/null; then echo "server exited early"; tail -30 "server_$1.log"; return 1; fi
              sleep 2
            done
            START=$(date +%s)
            if "$K" examples > "examples_$1.txt" 2>&1; then OK=0; else OK=1; fi
            cat "examples_$1.txt" | tail -6
            echo "device $1: seconds for both requests: $(( $(date +%s) - START ))"
            kill "$SERVER" 2>/dev/null || true
            sleep 2
            if [ "$OK" != "0" ]; then echo "--- server log, device $1"; grep -v "^INFO" "server_$1.log" | tail -25; return 1; fi
            test "$(sed -n '1p' "examples_$1.txt" | awk '{print $1, $4}')" = "act account"
            test "$(sed -n '2p' "examples_$1.txt" | awk '{print $1, $2}')" = "defer defer"
          }
          if ask auto; then echo "RESULT auto device: works"; else
            echo "RESULT auto device: FAILED"
            if ask cpu; then echo "RESULT forced cpu: works"; else echo "RESULT forced cpu: FAILED"; exit 1; fi
          fi
      - name: The default model's message on a machine without an NVIDIA GPU
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/kelter" download
          set +e
          "$RUNNER_TEMP/venv/bin/kelter" serve > default.txt 2>&1
          echo "exit code $?"
          cat default.txt

  default-on-cpu:
    # The default (Qwen3-4B) variant on Linux without a GPU: slow, and it may not fit in the runner's memory.
    # A pass shows the Linux code path works; a failure here is information, not a broken release.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          echo "KELTER_HOME=$RUNNER_TEMP/kelter-home" >> "$GITHUB_ENV"
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/venv/bin/python" -m pip install .
      - name: Download, serve the default variant on the CPU, ask the two examples
        working-directory: ${{ runner.temp }}
        env:
          KELTER_DEVICE: cpu
        run: |
          K="$RUNNER_TEMP/venv/bin/kelter"
          free -g | head -2
          "$K" download
          "$K" serve --port 8765 > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 900); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then break; fi
            if ! kill -0 "$SERVER" 2>/dev/null; then echo "server exited early"; tail -30 server.log; exit 1; fi
            sleep 2
          done
          START=$(date +%s)
          # The CPU is slow for a 4B model: post the first example directly with a long timeout.
          if "$RUNNER_TEMP/venv/bin/python" -c "
          import json, urllib.request
          from kelter.examples import EXAMPLES
          req = urllib.request.Request('http://127.0.0.1:8765/v1/systemone', data=json.dumps(EXAMPLES['act']).encode(), headers={'Content-Type': 'application/json'})
          a = json.load(urllib.request.urlopen(req, timeout=3000))['answers']['route']
          print('RESULT', a['choice'], a['action'], a['verifier']['basis'], round(a['confidence'], 4))
          " > answer.txt 2>&1; then OK=0; else OK=1; fi
          cat answer.txt | tail -4
          echo "seconds for one request: $(( $(date +%s) - START ))"
          kill "$SERVER" 2>/dev/null || true
          if [ "$OK" != "0" ]; then grep -v "^INFO" server.log | tail -25; exit 1; fi
          grep -q "^RESULT account" answer.txt
