name: end-to-end

# Manual only: it downloads about 4 GB of weights. Needs a public repository, because the weights
# are fetched from the releases without a login, the way a new user would.
on:
  workflow_dispatch:

jobs:
  serve:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Folder for weights and outputs
        run: echo "KELTER_HOME=$RUNNER_TEMP/kelter-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --outdir "$RUNNER_TEMP/dist" .
      - name: Install torch, then the wheel, into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            "$PY" -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          else
            "$PY" -m pip install torch==2.11.0
          fi
          "$PY" -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: What the machine offers
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -c "import platform, torch; from kelter.device import default_device; print('machine', platform.machine(), platform.platform()); print('mps available', getattr(torch.backends, 'mps', None) is not None and torch.backends.mps.is_available()); print('cuda available', torch.cuda.is_available()); print('kelter picks', default_device())"
          "$RUNNER_TEMP/venv/bin/kelter"
      - name: Download the smaller model without a login
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/kelter" download --variant lower-latency
          "$RUNNER_TEMP/venv/bin/kelter"
      - name: Serve it and ask the two example questions
        working-directory: ${{ runner.temp }}
        run: |
          K="$RUNNER_TEMP/venv/bin/kelter"
          "$K" serve --variant lower-latency --port 8765 > server.log 2>&1 &
          SERVER=$!
          for i in $(seq 1 150); do
            if curl -s -o /dev/null http://127.0.0.1:8765/; then break; fi
            if ! kill -0 "$SERVER" 2>/dev/null; then echo "server exited early"; cat server.log; exit 1; fi
            sleep 2
          done
          START=$(date +%s)
          "$K" examples | tee examples.txt
          echo "seconds for both requests: $(( $(date +%s) - START ))"
          kill "$SERVER" || true
          tail -5 server.log
          test "$(sed -n '1p' examples.txt | awk '{print $1, $4}')" = "act account"
          test "$(sed -n '2p' examples.txt | awk '{print $1, $2}')" = "defer defer"
      - name: The default model's message on a machine without an NVIDIA GPU
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/kelter" download
          set +e
          "$RUNNER_TEMP/venv/bin/kelter" serve > default.txt 2>&1
          echo "exit code $?"
          cat default.txt
