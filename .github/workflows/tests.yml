name: tests

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU torch, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install --no-deps -r requirements-laya.txt
          python -m pip install -e . --no-deps
      - name: JevBench client at the pinned commit (for test_jevbench_adapter_round_trip)
        # The benchmark's own client is public (MIT licence); the test runs our server against it.
        # Pinned to the commit the suite was written against, so a later change there cannot turn this job red.
        run: |
          git clone --quiet https://github.com/fstandhartinger/jevbench third_party/jevbench
          git -C third_party/jevbench checkout --quiet 609a664e81f46e03731600bd7bd9f1b7a61257c5
      - name: Test suite on CPU
        env:
          KELTER_DEVICE: cpu
          CUDA_VISIBLE_DEVICES: ""
          KELTER_FAIL_ON_SKIP: "1"  # tests/conftest.py: a skipped test fails the job (the JevBench and SDK tests must run)
        run: python -m pytest -q -rs

  windows:
    # the preflight and sentinel tests call the real unbuffered disk read, which exists on Windows only
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU torch, then the pinned requirements)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps
      - name: Resume, sentinel and preflight tests
        env:
          KELTER_DEVICE: cpu
          CUDA_VISIBLE_DEVICES: ""
          KELTER_FAIL_ON_SKIP: "1"
        run: python -m pytest -q -rs tests/test_train_resume.py

  wheel:
    # build the wheel, install it with CPU torch into a fresh venv outside the checkout, run kelter there
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist, twine check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --outdir "$RUNNER_TEMP/dist" .
          python -m twine check "$RUNNER_TEMP"/dist/*
      - name: Install the wheel into a fresh venv (CPU torch first)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/venv/bin/python" -m pip install "$RUNNER_TEMP"/dist/*.whl
      - name: kelter --version, kelter, kelter serve without weights
        working-directory: ${{ runner.temp }}
        env:
          KELTER_HOME: ${{ runner.temp }}/kelter-home
          CUDA_VISIBLE_DEVICES: ""
        run: |
          K="$RUNNER_TEMP/venv/bin/kelter"
          test "$("$K" --version)" = "kelter $(grep -m1 '^version' "$GITHUB_WORKSPACE/pyproject.toml" | cut -d'"' -f2)"
          "$K" | tee status.txt
          grep -q "installed package" status.txt
          grep -q "Next: kelter download" status.txt
          set +e
          "$K" serve > serve.txt 2>&1
          code=$?
          set -e
          cat serve.txt
          test "$code" -ne 0
          test "$(wc -l < serve.txt)" -eq 1
          grep -q "weights not found" serve.txt
          grep -q "kelter download" serve.txt
          grep -q "$KELTER_HOME/checkpoints" serve.txt
      - name: Every packaged file the runtime reads is in the wheel and the sdist
        working-directory: ${{ runner.temp }}
        env:
          KELTER_HOME: ${{ runner.temp }}/kelter-home
        run: |
          "$RUNNER_TEMP/venv/bin/python" - <<'PY'
          import json, sys
          from kelter import paths
          assert paths.checkout_root() is None, "expected installed mode"
          assert paths.ASSET_FILES, "no packaged files declared"
          for rel in paths.ASSET_FILES:
              f = paths.asset(rel)
              assert f.is_file() and f.stat().st_size > 0, f"missing from the wheel: {rel}"
              if f.suffix == ".json":
                  json.loads(f.read_text(encoding="utf-8"))
          print("wheel holds", len(paths.ASSET_FILES), "packaged files")
          PY
          "$RUNNER_TEMP/venv/bin/python" - "$RUNNER_TEMP"/dist/*.tar.gz <<'PY'
          import sys, tarfile
          from kelter import paths
          names = {n.split("/", 1)[1] for n in tarfile.open(sys.argv[1]).getnames() if "/" in n}
          missing = [k for k in paths.ASSET_FILES if k not in names]
          assert not missing, f"missing from the sdist: {missing}"
          print("sdist holds", len(paths.ASSET_FILES), "packaged files")
          PY
